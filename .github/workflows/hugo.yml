baseURL: https://fengdui.gitlab.io/
title: Hugo and GitLab Pages
copyright: © [PaperMod
  Contributors](https://github.com/adityatelange/hugo-PaperMod/graphs/contributors)
theme:
  - github.com/adityatelange/hugo-PaperMod
pagination:
  pagerSize: 10
  enableInlineShortcodes: true
  enableRobotsTXT: true
  buildDrafts: false
  buildFuture: false
  buildExpired: false
  enableEmoji: true
  pygmentsUseClasses: true
  mainsections:
    - posts
    - papermod
minify:
  disableXML: true
languages:
  en:
    languageName: English
    weight: 1
    taxonomies:
      category: categories
      tag: tags
      series: series
    menu:
      main:
        - name: Archive
          url: archives
          weight: 5
        - name: Search
          url: search/
          weight: 10
        - name: Tags
          url: tags/
          weight: 10
outputs:
  home:
    - HTML
    - RSS
    - JSON
params:
  env: production
  description: Theme PaperMod - https://github.com/adityatelange/hugo-PaperMod
  author: Theme PaperMod
  defaultTheme: auto
  ShowShareButtons: false
  ShowReadingTime: true
  displayFullLangName: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowRssButtonInSectionTermList: true
  ShowAllPagesInArchive: true
  ShowPageNums: true
  ShowToc: false
  images:
    - images/papermod-cover.png
  profileMode:
    enabled: false
    title: PaperMod
    imageUrl: "#"
    imageTitle: my image
    buttons:
      - name: Archives
        url: archives
      - name: Tags
        url: tags
  homeInfoParams:
    Title: 随手记录一些东西
    Content: "👋 Welcome to Hugo's theme PaperMod!\r

      \r

      \r\n"
  assets:
    disableHLJS: true
    favicon: favicon.ico
markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
services:
  instagram:
    disableInlineCSS: true
  twitter:
    disableInlineCSS: true
